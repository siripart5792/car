<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient (Deep Navy to Tech Indigo) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Emerald Checkmark Badge Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadow for Badges and Elements -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#064e3b" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" />
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Subtle grid / tech accents -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 5" opacity="0.2" />

  <!-- Stylized Modern Utility / Fleet Vehicle Silhouette -->
  <g filter="url(#shadow)">
    <!-- Main Vehicle Body -->
    <!-- Cabin Roof & Windshield -->
    <path d="M38 46 L50 29 C52 26 55 25 59 25 L73 25 C77 25 80 27 82 30 L93 46 Z" fill="#38bdf8" opacity="0.9" />
    <!-- Windshield glass shine -->
    <path d="M43 44 L52 31 C54 28 56 27 60 27 L70 27 C74 27 76 29 78 32 L87 44 Z" fill="#e0f2fe" opacity="0.95" />
    <!-- Windshield Divider -->
    <line x1="65" y1="27" x2="65" y2="44" stroke="#0284c7" stroke-width="1.8" opacity="0.6" />

    <!-- Hood & Cabin Lower Body -->
    <path d="M25 50 C25 47 27 45 30 45 L98 45 C101 45 103 47 103 50 L105 69 C105 73 102 76 98 76 L30 76 C26 76 23 73 23 69 Z" fill="#ffffff" />
    
    <!-- Grille & Front Accent -->
    <rect x="36" y="55" width="56" height="16" rx="4" fill="#0f172a" />
    <!-- Grille Bars -->
    <line x1="42" y1="59" x2="86" y2="59" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="42" y1="63" x2="86" y2="63" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="42" y1="67" x2="86" y2="67" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Headlights (Dual High-Output LED) -->
    <!-- Left Headlight -->
    <rect x="25" y="53" width="9" height="12" rx="2.5" fill="#fef08a" stroke="#ca8a04" stroke-width="1" />
    <!-- Right Headlight -->
    <rect x="94" y="53" width="9" height="12" rx="2.5" fill="#fef08a" stroke="#ca8a04" stroke-width="1" />

    <!-- Front Bumper -->
    <rect x="20" y="73" width="88" height="9" rx="3.5" fill="#334155" />
    <!-- License plate / PEA tag frame -->
    <rect x="52" y="74" width="24" height="6.5" rx="1.5" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8" />
    <rect x="55" y="76" width="18" height="2.5" fill="#2563eb" rx="0.5" />

    <!-- Wheels / Tires -->
    <rect x="22" y="79" width="14" height="11" rx="4" fill="#020617" />
    <rect x="92" y="79" width="14" height="11" rx="4" fill="#020617" />
  </g>

  <!-- Inspection Passed Shield Badge (Bottom Right Accent) -->
  <g filter="url(#badgeShadow)">
    <!-- Outer Glow Ring -->
    <circle cx="94" cy="94" r="23" fill="#10b981" opacity="0.25" />
    <!-- Badge Core -->
    <circle cx="94" cy="94" r="20" fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="2.5" />
    <!-- Clean Crisp Checkmark -->
    <path d="M85 94.5 L91.5 101 L103.5 87.5" fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Star Sparkle at Top Right (Quality Assurance) -->
  <path d="M102 20 Q102 26 108 26 Q102 26 102 32 Q102 26 96 26 Q102 26 102 20 Z" fill="#38bdf8" opacity="0.9" />
</svg>
